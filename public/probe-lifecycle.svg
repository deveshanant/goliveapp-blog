<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="300" rx="12" fill="#151824" stroke="#252838" stroke-width="1.5"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="url(#gG)" letter-spacing="1">KUBERNETES PROBE LIFECYCLE</text>

  <!-- Timeline base line -->
  <line x1="40" y1="130" x2="720" y2="130" stroke="#252838" stroke-width="2"/>

  <!-- Startup probe phase -->
  <rect x="40" y="105" width="180" height="50" rx="6" fill="#1e2235" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">Startup Probe</text>
  <text x="130" y="140" text-anchor="middle" font-size="9" fill="#94a3b8">GET /healthz · up to 150s</text>
  <text x="130" y="153" text-anchor="middle" font-size="9" fill="#94a3b8">failureThreshold: 30 × 5s</text>

  <!-- Startup fail path -->
  <path d="M 130 105 Q 130 72 190 72" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <text x="192" y="69" font-size="9" fill="#f87171">● fail → pod Restarted</text>

  <!-- Arrow startup → ready -->
  <line x1="220" y1="130" x2="268" y2="130" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="244" y="124" text-anchor="middle" font-size="9" fill="#6ee7b7">pass</text>

  <!-- Readiness phase -->
  <rect x="270" y="105" width="180" height="50" rx="6" fill="#1e2235" stroke="#818cf8" stroke-width="1.5"/>
  <text x="360" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">Readiness Probe</text>
  <text x="360" y="140" text-anchor="middle" font-size="9" fill="#94a3b8">GET /ready · every 5s</text>
  <text x="360" y="153" text-anchor="middle" font-size="9" fill="#94a3b8">Checks DB, cache, config</text>

  <!-- Readiness pass — traffic allowed -->
  <path d="M 360 155 L 360 190" stroke="#6ee7b7" stroke-width="1.2" fill="none" marker-end="url(#aw2)"/>
  <rect x="290" y="192" width="140" height="28" rx="5" fill="#0f2a1f" stroke="#6ee7b7" stroke-width="1"/>
  <text x="360" y="205" text-anchor="middle" font-size="9" fill="#6ee7b7">✓ Added to load balancer</text>
  <text x="360" y="217" text-anchor="middle" font-size="9" fill="#6ee7b7">Traffic routed to pod</text>

  <!-- Readiness fail path -->
  <path d="M 360 105 Q 360 68 450 68" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <text x="452" y="65" font-size="9" fill="#f87171">● fail → removed from LB (not restarted)</text>

  <!-- Arrow readiness → liveness -->
  <line x1="450" y1="130" x2="498" y2="130" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="474" y="124" text-anchor="middle" font-size="9" fill="#6ee7b7">pass</text>

  <!-- Liveness phase -->
  <rect x="500" y="105" width="180" height="50" rx="6" fill="#1e2235" stroke="#f472b6" stroke-width="1.5"/>
  <text x="590" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#f472b6">Liveness Probe</text>
  <text x="590" y="140" text-anchor="middle" font-size="9" fill="#94a3b8">GET /healthz · every 10s</text>
  <text x="590" y="153" text-anchor="middle" font-size="9" fill="#94a3b8">Just confirms process is up</text>

  <!-- Liveness fail -->
  <path d="M 590 105 Q 590 72 680 72" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <text x="682" y="69" font-size="9" fill="#f87171">● fail → pod Restarted</text>

  <!-- Continues arrow -->
  <line x1="680" y1="130" x2="718" y2="130" stroke="#252838" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="722" y="134" font-size="9" fill="#94a3b8">…</text>

  <!-- Timeline labels -->
  <text x="40" y="165" font-size="9" fill="#94a3b8">t=0</text>
  <text x="215" y="165" font-size="9" fill="#94a3b8">t=150s max</text>
  <text x="448" y="165" font-size="9" fill="#94a3b8">ongoing</text>
  <text x="496" y="165" font-size="9" fill="#94a3b8">ongoing</text>

  <!-- Probe overlap note -->
  <rect x="270" y="232" width="410" height="22" rx="5" fill="#1a1d27" stroke="#252838"/>
  <text x="475" y="247" text-anchor="middle" font-size="9" fill="#94a3b8">Readiness and Liveness run concurrently after Startup passes · Startup prevents premature liveness kills</text>

  <!-- Bottom key -->
  <rect x="40" y="268" width="10" height="10" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="277" font-size="9" fill="#94a3b8">Startup</text>
  <rect x="120" y="268" width="10" height="10" rx="2" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <text x="135" y="277" font-size="9" fill="#94a3b8">Readiness</text>
  <rect x="215" y="268" width="10" height="10" rx="2" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  <text x="230" y="277" font-size="9" fill="#94a3b8">Liveness</text>
  <line x1="295" y1="273" x2="315" y2="273" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="320" y="277" font-size="9" fill="#94a3b8">failure path</text>

  <defs>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ee7b7"/>
    </marker>
    <marker id="aw2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ee7b7"/>
    </marker>
  </defs>
</svg>
