<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="760" height="310" rx="12" fill="#151824" stroke="#252838" stroke-width="1.5"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="url(#hdr)" letter-spacing="1">TOPOLOGY SPREAD CONSTRAINTS</text>

  <!-- Divider -->
  <line x1="380" y1="38" x2="380" y2="295" stroke="#252838" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: WITHOUT TSC ===== -->
  <text x="190" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">✗  Without TSC — Unbalanced</text>

  <!-- AZ-1a (overloaded) -->
  <rect x="20" y="65" width="95" height="145" rx="7" fill="#1e1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="67" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#f87171">us-east-1a</text>
  <!-- 4 pods in this AZ -->
  <circle cx="45" cy="100" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="45" y="104" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="90" cy="100" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="90" y="104" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="45" cy="130" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="45" y="134" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="90" cy="130" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="90" y="134" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <text x="67" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#f59e0b">4 pods</text>
  <!-- zone failure overlay -->
  <rect x="20" y="65" width="95" height="145" rx="7" fill="#f87171" fill-opacity="0.08"/>
  <text x="67" y="195" text-anchor="middle" font-size="9" fill="#f87171">⚡ Zone failure</text>

  <!-- AZ-1b (1 pod) -->
  <rect x="130" y="65" width="95" height="145" rx="7" fill="#1e2235" stroke="#252838" stroke-width="1.5"/>
  <text x="177" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#94a3b8">us-east-1b</text>
  <circle cx="177" cy="115" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="177" y="119" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <text x="177" y="160" text-anchor="middle" font-size="10" fill="#94a3b8">1 pod</text>

  <!-- AZ-1c (0 pods) -->
  <rect x="240" y="65" width="95" height="145" rx="7" fill="#1a1a1a" stroke="#252838" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="287" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#94a3b8">us-east-1c</text>
  <text x="287" y="140" text-anchor="middle" font-size="22" fill="#252838">∅</text>
  <text x="287" y="160" text-anchor="middle" font-size="10" fill="#94a3b8">0 pods</text>

  <!-- Result bad -->
  <rect x="20" y="220" width="315" height="30" rx="6" fill="#2a0f0f" stroke="#f87171" stroke-width="1"/>
  <text x="177" y="231" text-anchor="middle" font-size="9" fill="#f87171" font-weight="600">Zone failure → 4 of 5 pods lost</text>
  <text x="177" y="244" text-anchor="middle" font-size="9" fill="#94a3b8">Service down. All eggs in one basket.</text>

  <!-- ===== RIGHT: WITH TSC ===== -->
  <text x="570" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">✓  With TSC — Balanced</text>

  <!-- AZ-1a (2 pods, zone failure) -->
  <rect x="395" y="65" width="95" height="145" rx="7" fill="#1e1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="442" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#f87171">us-east-1a</text>
  <circle cx="418" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="418" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="466" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="466" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <text x="442" y="155" text-anchor="middle" font-size="10" fill="#94a3b8">2 pods</text>
  <rect x="395" y="65" width="95" height="145" rx="7" fill="#f87171" fill-opacity="0.08"/>
  <text x="442" y="195" text-anchor="middle" font-size="9" fill="#f87171">⚡ Zone failure</text>

  <!-- AZ-1b (2 pods, healthy) -->
  <rect x="505" y="65" width="95" height="145" rx="7" fill="#0f2a1f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="552" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#6ee7b7">us-east-1b</text>
  <circle cx="528" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="528" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="576" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="576" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <text x="552" y="155" text-anchor="middle" font-size="10" fill="#6ee7b7">✓ running</text>

  <!-- AZ-1c (2 pods, healthy) -->
  <rect x="615" y="65" width="95" height="145" rx="7" fill="#0f2a1f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="662" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#6ee7b7">us-east-1c</text>
  <circle cx="638" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="638" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <circle cx="686" cy="110" r="11" fill="#6ee7b7" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="686" y="114" text-anchor="middle" font-size="8" fill="#6ee7b7">app</text>
  <text x="662" y="155" text-anchor="middle" font-size="10" fill="#6ee7b7">✓ running</text>

  <!-- Result good -->
  <rect x="395" y="220" width="315" height="30" rx="6" fill="#0f2a1f" stroke="#6ee7b7" stroke-width="1"/>
  <text x="552" y="231" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Zone failure → 2 of 6 pods lost</text>
  <text x="552" y="244" text-anchor="middle" font-size="9" fill="#94a3b8">4 pods still serving. Service stays up.</text>

  <!-- Config snippet at bottom -->
  <rect x="20" y="260" width="720" height="40" rx="6" fill="#1a1d27" stroke="#252838"/>
  <text x="380" y="276" text-anchor="middle" font-size="9" fill="#818cf8" font-weight="600">topologySpreadConstraints: maxSkew: 1 · topologyKey: topology.kubernetes.io/zone</text>
  <text x="380" y="291" text-anchor="middle" font-size="9" fill="#94a3b8">whenUnsatisfiable: DoNotSchedule · labelSelector: matchLabels: app: my-app</text>
</svg>
