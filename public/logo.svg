<svg width="100" height="260" viewBox="0 0 100 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Flame -->
  <ellipse cx="50" cy="228" rx="9" ry="18" fill="#f97316" opacity="0.9"/>
  <ellipse cx="50" cy="230" rx="5" ry="13" fill="#fef08a"/>

  <!-- Left fin -->
  <polygon points="22,195 10,230 32,220" fill="#1d4ed8"/>
  <!-- Right fin -->
  <polygon points="78,195 90,230 68,220" fill="#1d4ed8"/>

  <!-- Rocket body -->
  <rect x="28" y="90" width="44" height="140" rx="4" fill="#326CE5"/>

  <!-- Nose cone -->
  <path d="M28,92 Q28,20 50,8 Q72,20 72,92 Z" fill="#326CE5"/>

  <!-- Porthole ring -->
  <circle cx="50" cy="175" r="17" fill="white" opacity="0.15"/>
  <circle cx="50" cy="175" r="15" fill="#1e3a8a"/>
  <circle cx="50" cy="175" r="14" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>

  <!-- Hub -->
  <circle cx="50" cy="175" r="3.5" fill="white"/>

  <!-- 7 spoke dots -->
  <g fill="white">
    <circle cx="50" cy="164" r="2"/>
    <circle cx="59.4" cy="167.5" r="2"/>
    <circle cx="61" cy="177.5" r="2"/>
    <circle cx="54.5" cy="185.5" r="2"/>
    <circle cx="45.5" cy="185.5" r="2"/>
    <circle cx="39" cy="177.5" r="2"/>
    <circle cx="40.6" cy="167.5" r="2"/>
  </g>

  <!-- Spokes -->
  <g stroke="white" stroke-width="1.4" stroke-linecap="round">
    <line x1="50" y1="171.5" x2="50" y2="166"/>
    <line x1="50" y1="171.5" x2="56.5" y2="169.5"/>
    <line x1="50" y1="171.5" x2="58" y2="176"/>
    <line x1="50" y1="171.5" x2="53" y2="182.5"/>
    <line x1="50" y1="171.5" x2="47" y2="182.5"/>
    <line x1="50" y1="171.5" x2="42" y2="176"/>
    <line x1="50" y1="171.5" x2="43.5" y2="169.5"/>
  </g>

  <!-- Highlight stripe -->
  <rect x="28" y="110" width="5" height="60" rx="2" fill="white" opacity="0.12"/>
</svg>
