<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="gradG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="260" rx="12" fill="#151824" stroke="#252838" stroke-width="1.5"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="url(#gradG)" letter-spacing="1">ROLLING UPDATE  ·  maxUnavailable: 0  ·  maxSurge: 1</text>

  <!-- Dividers between steps -->
  <line x1="190" y1="48" x2="190" y2="245" stroke="#252838" stroke-width="1"/>
  <line x1="380" y1="48" x2="380" y2="245" stroke="#252838" stroke-width="1"/>
  <line x1="570" y1="48" x2="570" y2="245" stroke="#252838" stroke-width="1"/>

  <!-- Step labels -->
  <text x="95" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">STEP 1 · Before deploy</text>
  <text x="285" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">STEP 2 · Surge pod added</text>
  <text x="475" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">STEP 3 · Old pod removed</text>
  <text x="665" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">STEP 4 · Complete</text>

  <!-- === STEP 1: 3 old pods === -->
  <!-- Pod 1 old -->
  <rect x="30" y="80" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="50" cy="102" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="50" y="107" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="103" y="99" font-size="11" fill="#e2e8f0">pod-1</text>
  <text x="103" y="114" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- Pod 2 old -->
  <rect x="30" y="133" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="50" cy="155" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="50" y="160" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="103" y="152" font-size="11" fill="#e2e8f0">pod-2</text>
  <text x="103" y="167" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- Pod 3 old -->
  <rect x="30" y="186" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="50" cy="208" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="50" y="213" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="103" y="205" font-size="11" fill="#e2e8f0">pod-3</text>
  <text x="103" y="220" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- === STEP 2: 3 old + 1 new (surge) === -->
  <!-- old pods -->
  <rect x="220" y="80" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="240" cy="102" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="240" y="107" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="293" y="99" font-size="11" fill="#e2e8f0">pod-1</text>
  <text x="293" y="114" font-size="9" fill="#6ee7b7">● Running</text>

  <rect x="220" y="133" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="240" cy="155" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="240" y="160" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="293" y="152" font-size="11" fill="#e2e8f0">pod-2</text>
  <text x="293" y="167" font-size="9" fill="#6ee7b7">● Running</text>

  <rect x="220" y="186" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="240" cy="208" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="240" y="213" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="293" y="205" font-size="11" fill="#e2e8f0">pod-3</text>
  <text x="293" y="220" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- new surge pod -->
  <rect x="220" y="80" width="130" height="44" rx="7" fill="#1a1830" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="240" cy="102" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="240" y="107" text-anchor="middle" font-size="9" fill="#818cf8">v2</text>
  <text x="293" y="99" font-size="11" fill="#e2e8f0">pod-new</text>
  <text x="293" y="114" font-size="9" fill="#f59e0b">◌ Starting…</text>

  <!-- surge label -->
  <rect x="296" y="72" width="44" height="14" rx="4" fill="#818cf8" fill-opacity="0.15"/>
  <text x="318" y="82" text-anchor="middle" font-size="8" fill="#818cf8">+surge</text>

  <!-- === STEP 3: 2 old + 1 new ready === -->
  <rect x="410" y="80" width="130" height="44" rx="7" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="430" cy="102" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="430" y="107" text-anchor="middle" font-size="9" fill="#818cf8">v2</text>
  <text x="483" y="99" font-size="11" fill="#e2e8f0">pod-new</text>
  <text x="483" y="114" font-size="9" fill="#6ee7b7">● Ready ✓</text>

  <rect x="410" y="133" width="130" height="44" rx="7" fill="#1e2235" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="430" cy="155" r="8" fill="#6ee7b7" fill-opacity="0.15" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="430" y="160" text-anchor="middle" font-size="9" fill="#6ee7b7">v1</text>
  <text x="483" y="152" font-size="11" fill="#e2e8f0">pod-2</text>
  <text x="483" y="167" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- old pod terminated -->
  <rect x="410" y="186" width="130" height="44" rx="7" fill="#1a0f0f" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <circle cx="430" cy="208" r="8" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="1.5"/>
  <text x="430" y="213" text-anchor="middle" font-size="9" fill="#f87171">v1</text>
  <text x="483" y="205" font-size="11" fill="#94a3b8">pod-1</text>
  <text x="483" y="220" font-size="9" fill="#f87171">✕ Terminating</text>

  <!-- === STEP 4: 3 new pods === -->
  <rect x="600" y="80" width="130" height="44" rx="7" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="620" cy="102" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="620" y="107" text-anchor="middle" font-size="9" fill="#818cf8">v2</text>
  <text x="673" y="99" font-size="11" fill="#e2e8f0">pod-a</text>
  <text x="673" y="114" font-size="9" fill="#6ee7b7">● Running</text>

  <rect x="600" y="133" width="130" height="44" rx="7" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="620" cy="155" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="620" y="160" text-anchor="middle" font-size="9" fill="#818cf8">v2</text>
  <text x="673" y="152" font-size="11" fill="#e2e8f0">pod-b</text>
  <text x="673" y="167" font-size="9" fill="#6ee7b7">● Running</text>

  <rect x="600" y="186" width="130" height="44" rx="7" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="620" cy="208" r="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
  <text x="620" y="213" text-anchor="middle" font-size="9" fill="#818cf8">v2</text>
  <text x="673" y="205" font-size="11" fill="#e2e8f0">pod-c</text>
  <text x="673" y="220" font-size="9" fill="#6ee7b7">● Running</text>

  <!-- arrows between steps -->
  <path d="M 162 163 L 218 163" stroke="url(#gradG)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 352 163 L 408 163" stroke="url(#gradG)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 542 163 L 598 163" stroke="url(#gradG)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ee7b7"/>
    </marker>
  </defs>

  <!-- bottom key -->
  <rect x="200" y="240" width="12" height="8" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="216" y="248" font-size="9" fill="#94a3b8">v1 (old)</text>
  <rect x="290" y="240" width="12" height="8" rx="2" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <text x="306" y="248" font-size="9" fill="#94a3b8">v2 (new)</text>
  <rect x="380" y="240" width="12" height="8" rx="2" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="396" y="248" font-size="9" fill="#94a3b8">terminating</text>
  <text x="490" y="248" font-size="9" fill="#94a3b8">Zero requests dropped — new pod must pass readiness before old is killed</text>
</svg>
