<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ee7b7"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f87171"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="12" fill="#151824" stroke="#252838" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="4" rx="2" fill="url(#hdr)"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="url(#hdr)" letter-spacing="1">EKS CLUSTER ROLLBACK — DECISION FLOW</text>

  <!-- START -->
  <rect x="280" y="42" width="200" height="32" rx="16" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <text x="380" y="62" text-anchor="middle" font-size="11" fill="#818cf8" font-weight="600">Issues after upgrade?</text>
  <line x1="380" y1="74" x2="380" y2="92" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Gate 1: 7-day window -->
  <rect x="260" y="94" width="240" height="38" rx="6" fill="#1e2235" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="108" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">Within 7 days of upgrade?</text>
  <text x="380" y="124" text-anchor="middle" font-size="9" fill="#94a3b8">After 7 days — rollback unavailable</text>

  <!-- NO path right -->
  <line x1="500" y1="113" x2="560" y2="113" stroke="#f87171" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="530" y="107" text-anchor="middle" font-size="9" fill="#f87171">NO</text>
  <rect x="562" y="97" width="165" height="32" rx="6" fill="#2a0f0f" stroke="#f87171" stroke-width="1"/>
  <text x="644" y="112" text-anchor="middle" font-size="9" fill="#f87171">Cannot rollback</text>
  <text x="644" y="124" text-anchor="middle" font-size="9" fill="#94a3b8">Contact AWS Support</text>

  <!-- YES path down -->
  <line x1="380" y1="132" x2="380" y2="150" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="393" y="144" font-size="9" fill="#6ee7b7">YES</text>

  <!-- Gate 2: Insights -->
  <rect x="245" y="152" width="270" height="38" rx="6" fill="#1e2235" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="167" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">ERROR / UNKNOWN insights?</text>
  <text x="380" y="182" text-anchor="middle" font-size="9" fill="#94a3b8">aws eks list-insights --filter ROLLBACK_READINESS</text>

  <!-- YES path right (resolve) -->
  <line x1="515" y1="171" x2="562" y2="171" stroke="#f87171" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="539" y="165" text-anchor="middle" font-size="9" fill="#f87171">YES</text>
  <rect x="564" y="155" width="165" height="32" rx="6" fill="#2a1a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="646" y="168" text-anchor="middle" font-size="9" fill="#f59e0b">Resolve issues</text>
  <text x="646" y="180" text-anchor="middle" font-size="9" fill="#94a3b8">or add --force flag</text>
  <!-- loop back -->
  <path d="M 729 171 Q 745 171 745 113 Q 745 95 730 95" stroke="#f59e0b" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#ay)"/>

  <!-- NO path down -->
  <line x1="380" y1="190" x2="380" y2="208" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="393" y="202" font-size="9" fill="#6ee7b7">NO / resolved</text>

  <!-- Step 2: Worker Nodes -->
  <rect x="200" y="210" width="360" height="50" rx="6" fill="#1e2235" stroke="#252838"/>
  <text x="380" y="227" text-anchor="middle" font-size="10" fill="#e2e8f0" font-weight="600">Prepare worker nodes</text>
  <text x="258" y="244" font-size="8" fill="#6ee7b7">Auto Mode: automatic</text>
  <text x="258" y="254" font-size="8" fill="#94a3b8">MNG: update-nodegroup-version</text>
  <text x="480" y="244" font-size="8" fill="#94a3b8">Self-managed: update AMIs</text>
  <text x="480" y="254" font-size="8" fill="#f87171">Fargate: delete pods first</text>

  <line x1="380" y1="260" x2="380" y2="278" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Step 3: Add-ons -->
  <rect x="235" y="280" width="290" height="36" rx="6" fill="#1e2235" stroke="#252838"/>
  <text x="380" y="295" text-anchor="middle" font-size="10" fill="#e2e8f0" font-weight="600">Downgrade incompatible add-ons</text>
  <text x="380" y="309" text-anchor="middle" font-size="9" fill="#94a3b8">aws eks update-addon --addon-version &lt;N-1 compatible&gt;</text>

  <line x1="380" y1="316" x2="380" y2="334" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Step 4: Initiate -->
  <rect x="210" y="336" width="340" height="36" rx="6" fill="#1a1830" stroke="#818cf8" stroke-width="1.5"/>
  <text x="380" y="350" text-anchor="middle" font-size="10" fill="#818cf8" font-weight="600">Initiate rollback</text>
  <text x="380" y="364" text-anchor="middle" font-size="9" fill="#94a3b8">aws eks update-cluster-version --kubernetes-version N-1</text>

  <line x1="380" y1="372" x2="380" y2="390" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Done -->
  <rect x="270" y="392" width="220" height="22" rx="11" fill="#0f2a1f" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="380" y="407" text-anchor="middle" font-size="10" fill="#6ee7b7" font-weight="600">Monitor · aws eks describe-update</text>
</svg>
