<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flame -->
  <ellipse cx="32" cy="56" rx="6" ry="9" fill="#f97316"/>
  <ellipse cx="32" cy="58" rx="3.5" ry="6" fill="#fef08a"/>

  <!-- Left fin -->
  <polygon points="14,46 8,60 20,54" fill="#1d4ed8"/>
  <!-- Right fin -->
  <polygon points="50,46 56,60 44,54" fill="#1d4ed8"/>

  <!-- Rocket body -->
  <rect x="20" y="22" width="24" height="36" rx="3" fill="#326CE5"/>

  <!-- Nose cone -->
  <path d="M20,24 Q20,4 32,2 Q44,4 44,24 Z" fill="#326CE5"/>

  <!-- Porthole -->
  <circle cx="32" cy="42" r="8" fill="#1e3a8a"/>
  <circle cx="32" cy="42" r="7" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <circle cx="32" cy="42" r="2" fill="white"/>

  <!-- 6 spokes -->
  <g stroke="white" stroke-width="1.2" stroke-linecap="round">
    <line x1="32" y1="40" x2="32" y2="36"/>
    <line x1="32" y1="44" x2="32" y2="48"/>
    <line x1="30.3" y1="40.5" x2="27" y2="38.5"/>
    <line x1="33.7" y1="43.5" x2="37" y2="45.5"/>
    <line x1="33.7" y1="40.5" x2="37" y2="38.5"/>
    <line x1="30.3" y1="43.5" x2="27" y2="45.5"/>
  </g>

  <!-- Body highlight -->
  <rect x="20" y="28" width="3" height="22" rx="1.5" fill="white" opacity="0.15"/>
</svg>
